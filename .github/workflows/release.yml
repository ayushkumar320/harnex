name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run python -c 'import agentharness; print(agentharness.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match agentharness.__version__ $version" >&2
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    # Trusted publishing: configure this repository and workflow as a PyPI
    # publisher, so no API token is stored in the repository.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    # The wrapper installs the wheel from PyPI at postinstall time, so PyPI has to
    # publish first or a fresh `npm install` would fail.
    needs: pypi
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Wait for the release to be installable from PyPI
        working-directory: npm
        run: |
          version="$(node -p "require('./package.json').pythonVersion")"
          for _ in $(seq 1 30); do
            if python -m pip download --no-deps --dest /tmp/pypi-check "agentgap==$version"; then
              exit 0
            fi
            sleep 20
          done
          echo "agentgap==$version was not installable from PyPI in time" >&2
          exit 1
      - name: Smoke test the published wheel through the wrapper
        working-directory: npm
        run: |
          node install.js
          node bin/harness.js --version
      - run: npm publish --provenance --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
