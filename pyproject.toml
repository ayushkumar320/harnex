[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentharness"
dynamic = ["version"]
description = "Reliability auditor and constrained harness generator for AI agent repositories"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayush Kumar", email = "ayushofficial85385@gmail.com" }]
keywords = ["ai-agents", "reliability", "static-analysis", "audit", "llm", "sandbox"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "detect-secrets>=1.5,<2",
  "groq>=0.31,<1",
  "httpx>=0.28,<1",
  "huggingface-hub>=0.30,<2",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "libcst>=1.5,<2",
  "networkx>=3.4,<4",
  "openai>=1.68,<3",
  "pathspec>=0.12,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "rapidfuzz>=3.10,<4",
  "rich>=13.9,<15",
  "structlog>=25,<26",
  "tavily-python>=0.7.26,<1",
  "tenacity>=9,<10",
  "typer>=0.16,<1",
]

[project.urls]
Homepage = "https://github.com/ayushkumar320/harnex"
Repository = "https://github.com/ayushkumar320/harnex"
Changelog = "https://github.com/ayushkumar320/harnex/blob/main/CHANGELOG.md"
Issues = "https://github.com/ayushkumar320/harnex/issues"

[project.scripts]
harness = "agentharness.cli:app"

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.version]
path = "src/agentharness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentharness"]

[tool.hatch.build.targets.sdist]
include = ["src/agentharness", "README.md", "CHANGELOG.md", "LICENSE", "SECURITY.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["agentharness"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures/benchmark/syntax_error/agent.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentharness"]
