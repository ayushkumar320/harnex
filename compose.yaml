services:
  agentharness:
    build:
      context: .
    image: agentharness:dev
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    environment:
      AGENTHARNESS_MODEL_PROVIDER: ${AGENTHARNESS_MODEL_PROVIDER:-disabled}
      AGENTHARNESS_MODEL_NAME: ${AGENTHARNESS_MODEL_NAME:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      AGENTHARNESS_WEB_EVIDENCE_ENABLED: ${AGENTHARNESS_WEB_EVIDENCE_ENABLED:-false}
      AGENTHARNESS_TAVILY_MAX_CREDITS: ${AGENTHARNESS_TAVILY_MAX_CREDITS:-3}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
